const root=`<ellipse rx="110" ry="64" fill="#ffd166" stroke="#e76f51" stroke-width="5"/><use href="#i-${M.ic}" x="-26" y="-58" width="52" height="52"/><text text-anchor="middle" y="${b?20:28}" font-size="15" font-weight="700">${a}</text><text text-anchor="middle" y="38" font-size="15" font-weight="700">${b}</text>`;
$('#v').innerHTML=e+root+nd}
const ap=()=>$('#v').setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.s})`);
function fit(){const s=$('#s'),W=s.clientWidth,Hh=s.clientHeight;let k=Math.min(W/(bd[1]-bd[0]+60),Hh/(bd[3]-bd[2]+60),1.3);if(narrow)k=Math.max(k,.7);V.s=k;V.x=W/2-k*(bd[0]+bd[1])/2;V.y=Hh/2-k*(bd[2]+bd[3])/2;ap()}
function zoomAt(f,c){const r=$('#s').getBoundingClientRect(),px=c[0]-r.left,py=c[1]-r.top,ns=Math.min(3,Math.max(.2,V.s*f));V.x=px-(px-V.x)*ns/V.s;V.y=py-(py-V.y)*ns/V.s;V.s=ns;ap()}
function zoom(f){const r=$('#s').getBoundingClientRect();zoomAt(f,[r.left+r.width/2,r.top+r.height/2])}
function tog(){const o=$('#ob').textContent=='Tout ouvrir';all.forEach(n=>n.z=!o&&n.d>=2&&n.k.length>0);$('#ob').textContent=o?'Replier':'Tout ouvrir';draw();fit()}
function tap(id){const n=all[id];if(!n)return;if(T){if(n.h)ask(n);return}
if(n.k.length){n.z=!n.z;draw();if(narrow){const s=$('#s');V.x=s.clientWidth/2-V.s*(n.x+n.s*n.w/2);V.y=s.clientHeight/2-V.s*n.y;ap()}}}
function bind(){const s=$('#s'),Pm=new Map();let d0=0,mv=0;const dist=()=>{const a=[...Pm.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
s.onpointerdown=e=>{s.setPointerCapture(e.pointerId);Pm.set(e.pointerId,[e.clientX,e.clientY]);if(Pm.size==1)mv=0;if(Pm.size==2)d0=dist()};
s.onpointermove=e=>{const o=Pm.get(e.pointerId);if(!o)return;if(Pm.size==1){V.x+=e.clientX-o[0];V.y+=e.clientY-o[1];mv+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);Pm.set(e.pointerId,[e.clientX,e.clientY]);ap()}else{Pm.set(e.pointerId,[e.clientX,e.clientY]);const d=dist(),a=[...Pm.values()];zoomAt(d/d0,[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]);d0=d;mv=99}};
s.onpointerup=e=>{Pm.delete(e.pointerId);if(mv<6&&Pm.size==0){const t=document.elementFromPoint(e.clientX,e.clientY),g=t&&t.closest('[data-i]');if(g)tap(+g.dataset.i)}};
s.onpointercancel=e=>Pm.delete(e.pointerId);
s.onwheel=e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,[e.clientX,e.clientY])}}
/* ---- entraînement ---- */
const sheet=h=>{const s=$('#sheet');s.hidden=!h;s.innerHTML=h||''};
function ui(){$('#tb').hidden=!T;if(T)$('#sc').textContent=`Trouvés ${T.ok}/${T.tot}`}
function train(f){all.forEach(n=>{n.z=false;n.h=false});const c=shuf(all.filter(n=>n.d>=2));c.slice(0,Math.max(1,Math.round(c.length*f))).forEach(n=>n.h=true);T={tot:all.filter(n=>n.h).length,ok:0,miss:new Set()};sheet('');ui();draw();fit()}
function redo(){if(!T||!T.miss.size)return sheet('<b>Aucun mot raté pour l’instant 👍</b>');const ids=[...T.miss];all.forEach(n=>n.h=false);ids.forEach(i=>all[i].h=true);T={tot:ids.length,ok:0,miss:new Set()};sheet('');ui();draw()}
function exitT(){T=null;collapse();sheet('');ui();draw();fit()}
function ask(n){const pool=shuf([...new Set(all.filter(x=>x.d>=2&&x.t!==n.t).map(x=>x.t))]).slice(0,3);cur=shuf([n.t,...pool]);const tr=[];let q=n.p;while(q){tr.unshift(q.t);q=q.p}
sheet(`<b>Quel mot-clé se cache ici ?</b><p>Chemin : ${[M.t,...tr].join(' › ')}</p>${cur.map((t,i)=>`<button onclick="pick(${n.id},${i},this)">${t}</button>`).join('')}<p id="fb"></p>`)}
function pick(id,i,b){const n=all[id],t=cur[i],fb=$('#fb');
if(t===n.t){n.h=false;T.ok++;draw();ui();fb.innerHTML=`✅ Bravo ! C’est bien « ${n.t} ». ${T.ok>=T.tot?'🎉 Carte reconstruite ! '+(T.miss.size?T.miss.size+' mot(s) à revoir : touche « 🔁 ratés ».':'Sans faute !'):''}<br><button onclick="sheet('')">Continuer</button>`;document.querySelectorAll('#sheet>button:not(:last-child)').forEach(x=>x.disabled=true)}
else{T.miss.add(id);b.disabled=true;const w=all.find(x=>x.t===t);fb.innerHTML=`❌ Pas ici. « ${t} » se trouve dans la branche « ${mn(w).t} » (sous « ${w.p.t} »). Ici, cherche dans la branche « ${mn(n).t} ». Essaie encore !`}}
home();
